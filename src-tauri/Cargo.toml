[package]
name = "qiliu"
version = "1.5.0"
description = "Qiliu, a focused Huya and Bilibili live player built with Tauri"
authors = ["Kihara-Ri"]
edition = "2021"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qiliu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
base64 = "0.22"
md5 = "0.7"
boa_engine = { version = "0.21.1", default-features = false, features = ["annex-b"] }
regex = "1"
sm3 = "0.4"
keyring-core = "1.0.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ed25519-dalek = "2"
sha2 = "0.10"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

# 更新器只在桌面端编译；tauri-plugin-updater 不支持 Android/iOS。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
jni = "0.21.1"
ndk-context = "0.1.1"
