name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            bundles: app
          - name: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # 应用内更新器的 minisign 私钥；未配置时走普通构建，仅缺少应用内更新。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Build installer with updater signing
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        # 叠加开启 createUpdaterArtifacts：本地与未配密钥的构建不受影响。
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json

      - name: Build installer
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Collect macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Seal the complete app bundle, not only its Rust executable, before
          # creating the DMG. An unsigned Tauri bundle can retain an incomplete
          # executable signature and fail codesign resource verification.
          npm run package:macos
          mkdir -p release-assets
          dmg="release/栖流 $version.dmg"
          hdiutil verify "$dmg"
          cp "$dmg" "release-assets/Qiliu-$version-macOS-${RUNNER_ARCH}.dmg"
          # 应用内更新器使用的 macOS 工件：app.tar.gz 与 minisign 签名。
          tarball="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' | head -n 1)"
          if [[ -n "$tarball" ]]; then
            cp "$tarball" "release-assets/Qiliu-$version-macOS-${RUNNER_ARCH}.app.tar.gz"
            if [[ -f "$tarball.sig" ]]; then
              cp "$tarball.sig" "release-assets/Qiliu-$version-macOS-${RUNNER_ARCH}.app.tar.gz.sig"
            else
              echo "未找到更新器签名（TAURI_SIGNING_PRIVATE_KEY 未配置？），latest.json 将不含 macOS。"
            fi
          else
            echo "未找到 macOS 更新器工件（createUpdaterArtifacts 已启用，理论上不应发生）。"
          fi

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName "release-assets/Qiliu-$version-Windows-x64-setup.exe"
          $signature = "$($installer.FullName).sig"
          if (Test-Path $signature) {
            Copy-Item $signature "release-assets/Qiliu-$version-Windows-x64-setup.exe.sig"
          } else {
            Write-Host "未找到更新器签名（TAURI_SIGNING_PRIVATE_KEY 未配置？），latest.json 将不含 Windows。"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run version:check && npm run test && npm run build

      - name: Initialize Android project
        run: npm run android:init

      - name: Sync launcher icons
        run: node scripts/sync-android-icons.mjs

      - name: Restore release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qiliu-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/qiliu-upload.jks" >> "$GITHUB_ENV"

      - name: Configure APK signing
        run: node scripts/configure-android-signing.mjs

      - name: Build APK
        run: npm run tauri -- android build --apk --target aarch64 --ci

      - name: Collect APK
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          suffix=""
          if [[ -z "${ANDROID_KEYSTORE_PATH:-}" ]]; then suffix="-debug"; fi
          cp "$apk" "release-assets/Qiliu-$version-Android-arm64${suffix}.apk"

      - name: Verify launcher icon
        shell: bash
        run: |
          # Release APKs obfuscate resource names, so verify the built project's
          # res/ instead: it must match the committed icons, not the Tauri
          # template defaults that `tauri android init` generates.
          for f in ic_launcher.png ic_launcher_foreground.png ic_launcher_round.png; do
            expected="$(md5sum < "src-tauri/icons/android/mipmap-xxxhdpi/$f" | awk '{print $1}')"
            actual="$(md5sum < "src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/$f" | awk '{print $1}')"
            if [[ -z "$actual" || "$expected" != "$actual" ]]; then
              echo "gen/android 启动器图标与 src-tauri/icons/android 不一致（$f），构建将使用 Tauri 默认图标。"
              exit 1
            fi
          done
          echo "Android 启动器图标与仓库图标一致。"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: installer-Android
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Include investigation and release procedure
        run: |
          cp docs/live-playback-fix-2026-09-28.md release-assets/Qiliu-live-playback-report.md
          cp docs/release-process.md release-assets/Qiliu-release-process.md

      - name: Build updater manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/make-update-manifest.mjs "$version" release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            /^## / { if (found) exit; if ($2 == version) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "栖流 ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
